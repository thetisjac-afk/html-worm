<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chemical Worm Cursor Creature</title>
  <style>
    :root {
      color-scheme: dark;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <script>
    const CONFIG = {
      spineNodes: 36,
      segmentLength: 18,
      bodyWidth: 24,
      lineWidth: 1.05,
      dotRadius: 1.25,
      fixedDt: 1 / 120,
      maxFrameDt: 1 / 20,
      maxSubsteps: 8,
      damping: 0.994,
      forceScale: 420,
      solverIterations: 14,
      spineStiffness: 0.92,
      bendStiffness: 0.24,
      braceStiffness: 0.1,
      frontBand: 0.22,
      rearBand: 0.28,
      extendDuration: 0.31,
      plantDuration: 0.1,
      contractDuration: 0.28,
      releaseDuration: 0.12,
      extendGain: 0.31,
      contractGain: 0.43,
      rearPreload: 0.08,
      turnForce: 0.12,
      turnRate: 5.8,
      turnDamping: 0.78,
      turnLimit: 0.88,
      sensorDistance: 60,
      sensorSpread: 22,
      idleTurnNoise: 0.18,
      settleRadius: 16,
      slowRadius: 180,
      freeForwardDrag: 2.1,
      freeBackwardDrag: 2.5,
      freeLateralDrag: 8.5,
      anchoredForwardDrag: 22,
      anchoredBackwardDrag: 26,
      anchoredLateralDrag: 32,
      anchorEngageRate: 11,
      anchorReleaseRate: 7,
      anchorThreshold: 0.68,
      anchorRelaxThreshold: 0.42,
      anchorSlip: 4.5,
      anchorLateralSlip: 3,
      anchorPull: 0.96,
      pressureBulge: 0.88,
      pressureLead: 0.36,
      stretchSlim: 0.24,
      turnWidthBias: 0.18,
      anchorFlatten: 0.15,
      headLagRate: 16,
      bodyLagRate: 11,
      tailLagRate: 7
    };

    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    let width = 0;
    let height = 0;
    let dpr = 1;

    const pointer = {
      x: 0,
      y: 0,
      active: false
    };

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function smoothstep(t) {
      return t * t * (3 - 2 * t);
    }

    function hypot(x, y) {
      return Math.hypot(x, y) || 1;
    }

    function normalizeInto(out, x, y) {
      const length = Math.hypot(x, y) || 1;
      out.x = x / length;
      out.y = y / length;
      return out;
    }

    function dot(ax, ay, bx, by) {
      return ax * bx + ay * by;
    }

    function expSmoothing(rate, dt) {
      return 1 - Math.exp(-rate * dt);
    }

    function band(t, center, radius) {
      const d = Math.abs(t - center) / Math.max(radius, 0.0001);
      if (d >= 1) {
        return 0;
      }
      return smoothstep(1 - d);
    }

    function easePulse(t) {
      if (t <= 0) {
        return 0;
      }
      if (t < 0.25) {
        return smoothstep(t / 0.25);
      }
      if (t < 0.4) {
        return 1;
      }
      if (t < 1) {
        return 1 - smoothstep((t - 0.4) / 0.6);
      }
      return 0;
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    class Particle {
      constructor(x, y, invMass) {
        this.x = x;
        this.y = y;
        this.px = x;
        this.py = y;
        this.fx = 0;
        this.fy = 0;
        this.invMass = invMass;
      }
    }

    class Link {
      constructor(a, b, length, stiffness) {
        this.a = a;
        this.b = b;
        this.baseLength = length;
        this.length = length;
        this.stiffness = stiffness;
      }

      solve() {
        const ax = this.a.x;
        const ay = this.a.y;
        const bx = this.b.x;
        const by = this.b.y;
        const dx = bx - ax;
        const dy = by - ay;
        const distance = Math.hypot(dx, dy) || 0.0001;
        const diff = (distance - this.length) / distance;
        const wa = this.a.invMass;
        const wb = this.b.invMass;
        const sum = wa + wb || 1;
        const scale = this.stiffness * diff;
        const ox = dx * scale;
        const oy = dy * scale;
        this.a.x += ox * (wa / sum);
        this.a.y += oy * (wa / sum);
        this.b.x -= ox * (wb / sum);
        this.b.y -= oy * (wb / sum);
      }
    }

    function createState() {
      const body = {
        particles: [],
        spine: [],
        primaryLinks: [],
        bendLinks: [],
        braceLinks: [],
        frames: Array.from({ length: CONFIG.spineNodes }, () => ({
          tx: 1,
          ty: 0,
          nx: 0,
          ny: 1,
          curvature: 0
        }))
      };

      const render = {
        left: Array.from({ length: CONFIG.spineNodes }, () => ({ x: 0, y: 0 })),
        right: Array.from({ length: CONFIG.spineNodes }, () => ({ x: 0, y: 0 })),
        pressure: Array(CONFIG.spineNodes).fill(0),
        width: Array(CONFIG.spineNodes).fill(0)
      };

      const actuation = {
        linkStretch: Array(CONFIG.spineNodes - 1).fill(0),
        nodePressure: Array(CONFIG.spineNodes).fill(0),
        frontBias: Array(CONFIG.spineNodes).fill(0),
        rearBias: Array(CONFIG.spineNodes).fill(0)
      };

      const contact = {
        desired: Array(CONFIG.spineNodes).fill(0),
        hold: Array(CONFIG.spineNodes).fill(0),
        anchorX: Array(CONFIG.spineNodes).fill(0),
        anchorY: Array(CONFIG.spineNodes).fill(0)
      };

      const state = {
        world: {
          time: 0,
          accumulator: 0
        },
        input: {
          pointer
        },
        body,
        intent: {
          rawTarget: { x: width * 0.66, y: height * 0.5 },
          target: { x: width * 0.66, y: height * 0.5 },
          urgency: 0,
          turnCmd: 0,
          turnVel: 0,
          targetDistance: 0,
          phaseNoise: 0
        },
        gait: {
          stage: "extend",
          stageTime: 0,
          cycle: 0,
          drive: 1
        },
        actuation,
        contact,
        render
      };

      BodyFactory.create(state);
      BodyFrames.update(state);
      RenderSystem.update(state, 1);
      return state;
    }

    const BodyFactory = {
      create(state) {
        const startX = width * 0.46;
        const startY = height * 0.54;

        for (let i = 0; i < CONFIG.spineNodes; i += 1) {
          const t = i / (CONFIG.spineNodes - 1);
          const x = startX - i * CONFIG.segmentLength;
          const y = startY + Math.sin(i * 0.3) * 4 + i * 0.08;
          const massBias = 1 - t * 0.38;
          const particle = new Particle(x, y, 1 / massBias);
          state.body.particles.push(particle);
          state.body.spine.push(particle);
          state.render.left[i].x = x;
          state.render.left[i].y = y;
          state.render.right[i].x = x;
          state.render.right[i].y = y;
          state.contact.anchorX[i] = x;
          state.contact.anchorY[i] = y;

          if (i > 0) {
            state.body.primaryLinks.push(
              new Link(state.body.spine[i - 1], state.body.spine[i], CONFIG.segmentLength, CONFIG.spineStiffness)
            );
          }

          if (i > 1) {
            state.body.bendLinks.push(
              new Link(state.body.spine[i - 2], state.body.spine[i], CONFIG.segmentLength * 2, CONFIG.bendStiffness)
            );
          }

          if (i > 2) {
            state.body.braceLinks.push(
              new Link(state.body.spine[i - 3], state.body.spine[i], CONFIG.segmentLength * 3, CONFIG.braceStiffness)
            );
          }
        }
      }
    };

    const BodyFrames = {
      update(state) {
        const spine = state.body.spine;
        const frames = state.body.frames;

        for (let i = 0; i < spine.length; i += 1) {
          const prev = spine[Math.max(0, i - 1)];
          const next = spine[Math.min(spine.length - 1, i + 1)];
          const frame = frames[i];
          normalizeInto(frame, prev.x - next.x, prev.y - next.y);
          const tx = frame.x;
          const ty = frame.y;
          frame.tx = tx;
          frame.ty = ty;
          frame.nx = -ty;
          frame.ny = tx;
          if (i > 0 && i < spine.length - 1) {
            const ax = spine[i - 1].x - spine[i].x;
            const ay = spine[i - 1].y - spine[i].y;
            const bx = spine[i + 1].x - spine[i].x;
            const by = spine[i + 1].y - spine[i].y;
            const cross = ax * by - ay * bx;
            const denom = hypot(ax, ay) * hypot(bx, by);
            frame.curvature = clamp(cross / denom, -1, 1);
          } else {
            frame.curvature = 0;
          }
        }
      }
    };

    const IntentSystem = {
      update(state, dt) {
        const intent = state.intent;
        const spine = state.body.spine;
        const head = spine[0];
        const neck = spine[1];
        const facingX = head.x - neck.x;
        const facingY = head.y - neck.y;
        const facingLen = Math.hypot(facingX, facingY) || 1;
        const tx = facingX / facingLen;
        const ty = facingY / facingLen;
        const nx = -ty;
        const ny = tx;

        if (pointer.active) {
          intent.rawTarget.x = pointer.x;
          intent.rawTarget.y = pointer.y;
        } else {
          intent.rawTarget.x =
            width * 0.56 +
            Math.cos(state.world.time * 0.28) * 170 +
            Math.sin(state.world.time * 0.67) * 26;
          intent.rawTarget.y =
            height * 0.52 +
            Math.sin(state.world.time * 0.21 + 0.4) * 110 +
            Math.cos(state.world.time * 0.49 + 0.9) * 18;
        }

        const targetBlend = expSmoothing(pointer.active ? 12 : 2.8, dt);
        intent.target.x = lerp(intent.target.x, intent.rawTarget.x, targetBlend);
        intent.target.y = lerp(intent.target.y, intent.rawTarget.y, targetBlend);

        const toTargetX = intent.target.x - head.x;
        const toTargetY = intent.target.y - head.y;
        const targetDistance = hypot(toTargetX, toTargetY);
        intent.targetDistance = targetDistance;
        intent.urgency = clamp((targetDistance - CONFIG.settleRadius) / CONFIG.slowRadius, 0, 1);
        state.gait.drive = pointer.active ? clamp((targetDistance - 8) / 90, 0, 1) : 0.72;

        const leftSensorX = head.x + tx * CONFIG.sensorDistance + nx * CONFIG.sensorSpread;
        const leftSensorY = head.y + ty * CONFIG.sensorDistance + ny * CONFIG.sensorSpread;
        const rightSensorX = head.x + tx * CONFIG.sensorDistance - nx * CONFIG.sensorSpread;
        const rightSensorY = head.y + ty * CONFIG.sensorDistance - ny * CONFIG.sensorSpread;

        const leftIntensity =
          1 / (Math.hypot(intent.target.x - leftSensorX, intent.target.y - leftSensorY) + 18);
        const rightIntensity =
          1 / (Math.hypot(intent.target.x - rightSensorX, intent.target.y - rightSensorY) + 18);
        const headingError = clamp((rightIntensity - leftIntensity) * 780, -1.2, 1.2);
        const idleNoise = pointer.active ? 0 : Math.sin(state.world.time * 1.2) * CONFIG.idleTurnNoise;
        const desiredTurn = clamp(headingError + idleNoise, -CONFIG.turnLimit, CONFIG.turnLimit);
        const settleGain = pointer.active
          ? clamp((targetDistance - CONFIG.settleRadius) / 64, 0, 1)
          : 1;
        const accel =
          (desiredTurn * settleGain - intent.turnCmd) * CONFIG.turnRate -
          intent.turnVel * CONFIG.turnDamping;
        intent.turnVel += accel * dt;
        intent.turnCmd = clamp(intent.turnCmd + intent.turnVel * dt, -CONFIG.turnLimit, CONFIG.turnLimit);
      }
    };

    const GaitSystem = {
      advance(state, dt) {
        const gait = state.gait;
        const intent = state.intent;
        gait.stageTime += dt;
        gait.cycle += dt;

        const turnDemand = Math.abs(intent.turnCmd);
        const extendDuration = CONFIG.extendDuration + turnDemand * 0.08 + (1 - gait.drive) * 0.06;
        const plantDuration = CONFIG.plantDuration + turnDemand * 0.04;
        const contractDuration = CONFIG.contractDuration + gait.drive * 0.05;
        const releaseDuration = CONFIG.releaseDuration + (1 - gait.drive) * 0.03;
        let duration = extendDuration;

        if (gait.stage === "extend") {
          duration = extendDuration;
        } else if (gait.stage === "plant") {
          duration = plantDuration;
        } else if (gait.stage === "contract") {
          duration = contractDuration;
        } else {
          duration = releaseDuration;
        }

        if (gait.stageTime >= duration) {
          gait.stageTime -= duration;
          if (gait.stage === "extend") {
            gait.stage = "plant";
          } else if (gait.stage === "plant") {
            gait.stage = "contract";
          } else if (gait.stage === "contract") {
            gait.stage = "release";
          } else {
            gait.stage = "extend";
          }
        }
      },

      updateActuation(state) {
        const gait = state.gait;
        const actuation = state.actuation;
        const contact = state.contact;
        const drive = gait.drive;
        const stage = gait.stage;
        let stageT = 0;
        let pulse = 0;

        if (stage === "extend") {
          stageT = gait.stageTime / (CONFIG.extendDuration + Math.abs(state.intent.turnCmd) * 0.08 + (1 - drive) * 0.06);
          pulse = easePulse(stageT);
        } else if (stage === "plant") {
          stageT = gait.stageTime / (CONFIG.plantDuration + Math.abs(state.intent.turnCmd) * 0.04);
          pulse = smoothstep(stageT);
        } else if (stage === "contract") {
          stageT = gait.stageTime / (CONFIG.contractDuration + drive * 0.05);
          pulse = easePulse(stageT);
        } else {
          stageT = gait.stageTime / (CONFIG.releaseDuration + (1 - drive) * 0.03);
          pulse = 1 - smoothstep(stageT);
        }

        for (let i = 0; i < CONFIG.spineNodes; i += 1) {
          const t = i / (CONFIG.spineNodes - 1);
          actuation.frontBias[i] = band(t, 0.18, CONFIG.frontBand);
          actuation.rearBias[i] = band(t, 0.82, CONFIG.rearBand);
        }

        for (let i = 0; i < CONFIG.spineNodes - 1; i += 1) {
          const t = i / (CONFIG.spineNodes - 2);
          const front = band(t, 0.23, 0.24);
          const rear = band(t, 0.72, 0.3);
          let stretch = 0;

          if (stage === "extend") {
            stretch = drive * (CONFIG.extendGain * front * pulse - CONFIG.rearPreload * rear * pulse);
          } else if (stage === "plant") {
            stretch = drive * (CONFIG.extendGain * front * (1 - stageT * 0.4));
          } else if (stage === "contract") {
            stretch = -drive * CONFIG.contractGain * rear * pulse;
          } else {
            stretch = -drive * CONFIG.contractGain * rear * (1 - stageT) * 0.35;
          }

          actuation.linkStretch[i] = stretch;
          state.body.primaryLinks[i].length =
            state.body.primaryLinks[i].baseLength * (1 + stretch);
        }

        for (let i = 0; i < state.body.bendLinks.length; i += 1) {
          const c0 = actuation.linkStretch[i] || 0;
          const c1 = actuation.linkStretch[i + 1] || 0;
          const blend = (c0 + c1) * 0.5;
          state.body.bendLinks[i].length =
            state.body.bendLinks[i].baseLength * (1 + blend * 0.42);
        }

        for (let i = 0; i < state.body.braceLinks.length; i += 1) {
          const c0 = actuation.linkStretch[i] || 0;
          const c1 = actuation.linkStretch[i + 1] || 0;
          const c2 = actuation.linkStretch[i + 2] || 0;
          const blend = (c0 + c1 + c2) / 3;
          state.body.braceLinks[i].length =
            state.body.braceLinks[i].baseLength * (1 + blend * 0.18);
        }

        for (let i = 0; i < CONFIG.spineNodes; i += 1) {
          const left = actuation.linkStretch[Math.max(0, i - 1)] || 0;
          const right = actuation.linkStretch[Math.min(actuation.linkStretch.length - 1, i)] || 0;
          actuation.nodePressure[i] = clamp(-(left + right) * 1.9, 0, 1.1);
        }

        for (let i = 0; i < CONFIG.spineNodes; i += 1) {
          const rear = actuation.rearBias[i];
          const front = actuation.frontBias[i];
          let desired = 0;

          if (stage === "extend") {
            desired = rear * (0.82 + pulse * 0.18);
          } else if (stage === "plant") {
            desired = lerp(rear * 0.7, front, smoothstep(stageT));
          } else if (stage === "contract") {
            desired = front * (0.82 + pulse * 0.18);
          } else {
            desired = lerp(front * 0.74, rear * 0.62, smoothstep(stageT));
          }

          contact.desired[i] = clamp(desired, 0, 1);
        }
      }
    };

    const ContactSystem = {
      update(state, dt) {
        const contact = state.contact;
        const actuation = state.actuation;
        const spine = state.body.spine;

        for (let i = 0; i < spine.length; i += 1) {
          const previous = contact.hold[i];
          const desired = contact.desired[i];
          const engage = expSmoothing(CONFIG.anchorEngageRate, dt);
          const release = expSmoothing(CONFIG.anchorReleaseRate, dt);
          let next = previous;

          if (desired > CONFIG.anchorThreshold || (previous > CONFIG.anchorRelaxThreshold && desired > 0.2)) {
            next = lerp(previous, desired, engage);
          } else {
            next = lerp(previous, desired, release);
          }

          contact.hold[i] = next;

          if (previous <= CONFIG.anchorRelaxThreshold && next > CONFIG.anchorRelaxThreshold) {
            contact.anchorX[i] = spine[i].x;
            contact.anchorY[i] = spine[i].y;
          }
        }
      }
    };

    const ForceSystem = {
      apply(state, dt) {
        const spine = state.body.spine;
        const frames = state.body.frames;
        const turn = state.intent.turnCmd;
        const drive = state.gait.drive;
        const stage = state.gait.stage;

        for (let i = 0; i < spine.length; i += 1) {
          spine[i].fx = 0;
          spine[i].fy = 0;
        }

        for (let i = 0; i < spine.length; i += 1) {
          const t = i / (spine.length - 1);
          const frame = frames[i];
          const free = 1 - state.contact.hold[i];
          const front = state.actuation.frontBias[i];
          const rear = state.actuation.rearBias[i];
          const pressure = state.actuation.nodePressure[i];

          let lateralBias = 0;
          if (stage === "extend") {
            lateralBias = turn * front * free * (0.55 + drive * 0.45);
          } else if (stage === "plant") {
            lateralBias = turn * front * (1 - state.contact.hold[i]) * 0.45;
          } else if (stage === "contract") {
            lateralBias = turn * front * free * 0.15;
          }

          const sideForce = lateralBias * CONFIG.turnForce * (1 - t * 0.25);
          spine[i].fx += frame.nx * sideForce;
          spine[i].fy += frame.ny * sideForce;

          const settle = state.intent.targetDistance < CONFIG.settleRadius * 1.4 ? 1 - state.gait.drive : 0;
          if (settle > 0) {
            const dampingForce = (front * 0.18 + rear * 0.08 + pressure * 0.12) * settle;
            spine[i].fx -= frame.tx * dot(spine[i].x - spine[i].px, spine[i].y - spine[i].py, frame.tx, frame.ty) * dampingForce;
            spine[i].fy -= frame.ty * dot(spine[i].x - spine[i].px, spine[i].y - spine[i].py, frame.tx, frame.ty) * dampingForce;
          }
        }
      }
    };

    const IntegrationSystem = {
      step(state, dt) {
        const spine = state.body.spine;
        const frames = state.body.frames;
        const contact = state.contact;

        for (let i = 0; i < spine.length; i += 1) {
          const particle = spine[i];
          const frame = frames[i];
          const hold = contact.hold[i];
          const vx = (particle.x - particle.px) * CONFIG.damping;
          const vy = (particle.y - particle.py) * CONFIG.damping;
          const vForward = dot(vx, vy, frame.tx, frame.ty);
          const vLateral = dot(vx, vy, frame.nx, frame.ny);
          const fDrag = vForward >= 0
            ? lerp(CONFIG.freeForwardDrag, CONFIG.anchoredForwardDrag, hold)
            : lerp(CONFIG.freeBackwardDrag, CONFIG.anchoredBackwardDrag, hold);
          const lDrag = lerp(CONFIG.freeLateralDrag, CONFIG.anchoredLateralDrag, hold);
          const forward = vForward * Math.exp(-fDrag * dt);
          const lateral = vLateral * Math.exp(-lDrag * dt);
          let nextVx = frame.tx * forward + frame.nx * lateral;
          let nextVy = frame.ty * forward + frame.ny * lateral;

          particle.px = particle.x;
          particle.py = particle.y;
          particle.x += nextVx + particle.fx * particle.invMass * dt * dt * CONFIG.forceScale;
          particle.y += nextVy + particle.fy * particle.invMass * dt * dt * CONFIG.forceScale;

          if (hold > CONFIG.anchorRelaxThreshold) {
            let ax = contact.anchorX[i];
            let ay = contact.anchorY[i];
            const dx = particle.x - ax;
            const dy = particle.y - ay;
            const tangential = dot(dx, dy, frame.tx, frame.ty);
            const lateralOffset = dot(dx, dy, frame.nx, frame.ny);

            if (Math.abs(tangential) > CONFIG.anchorSlip) {
              ax += frame.tx * (Math.abs(tangential) - CONFIG.anchorSlip) * Math.sign(tangential) * 0.45;
              ay += frame.ty * (Math.abs(tangential) - CONFIG.anchorSlip) * Math.sign(tangential) * 0.45;
            }

            if (Math.abs(lateralOffset) > CONFIG.anchorLateralSlip) {
              ax += frame.nx * (Math.abs(lateralOffset) - CONFIG.anchorLateralSlip) * Math.sign(lateralOffset) * 0.55;
              ay += frame.ny * (Math.abs(lateralOffset) - CONFIG.anchorLateralSlip) * Math.sign(lateralOffset) * 0.55;
            }

            contact.anchorX[i] = ax;
            contact.anchorY[i] = ay;
            particle.x = lerp(particle.x, ax, hold * CONFIG.anchorPull);
            particle.y = lerp(particle.y, ay, hold * CONFIG.anchorPull);
          }
        }

        for (let iteration = 0; iteration < CONFIG.solverIterations; iteration += 1) {
          if (iteration % 2 === 0) {
            for (let i = 0; i < state.body.primaryLinks.length; i += 1) {
              state.body.primaryLinks[i].solve();
            }
            for (let i = 0; i < state.body.bendLinks.length; i += 1) {
              state.body.bendLinks[i].solve();
            }
            for (let i = 0; i < state.body.braceLinks.length; i += 1) {
              state.body.braceLinks[i].solve();
            }
          } else {
            for (let i = state.body.braceLinks.length - 1; i >= 0; i -= 1) {
              state.body.braceLinks[i].solve();
            }
            for (let i = state.body.bendLinks.length - 1; i >= 0; i -= 1) {
              state.body.bendLinks[i].solve();
            }
            for (let i = state.body.primaryLinks.length - 1; i >= 0; i -= 1) {
              state.body.primaryLinks[i].solve();
            }
          }
        }

        this.constrainViewport(state);
        BodyFrames.update(state);
      },

      constrainViewport(state) {
        const margin = 80;
        for (let i = 0; i < state.body.spine.length; i += 1) {
          const particle = state.body.spine[i];
          let clamped = false;

          if (particle.x < -margin) {
            particle.x = -margin;
            particle.px = particle.x;
            clamped = true;
          } else if (particle.x > width + margin) {
            particle.x = width + margin;
            particle.px = particle.x;
            clamped = true;
          }

          if (particle.y < -margin) {
            particle.y = -margin;
            particle.py = particle.y;
            clamped = true;
          } else if (particle.y > height + margin) {
            particle.y = height + margin;
            particle.py = particle.y;
            clamped = true;
          }

          if (clamped && state.contact.hold[i] > CONFIG.anchorRelaxThreshold) {
            state.contact.anchorX[i] = particle.x;
            state.contact.anchorY[i] = particle.y;
          }
        }
      }
    };

    const RenderSystem = {
      update(state, snap = 0) {
        const spine = state.body.spine;
        const frames = state.body.frames;
        const render = state.render;
        const actuation = state.actuation;
        const contact = state.contact;

        for (let i = 0; i < spine.length; i += 1) {
          const t = i / (spine.length - 1);
          const frame = frames[i];
          const left = render.left[i];
          const right = render.right[i];
          const pressure = actuation.nodePressure[i];
          const leftStretch = actuation.linkStretch[Math.max(0, i - 1)] || 0;
          const rightStretch = actuation.linkStretch[Math.min(actuation.linkStretch.length - 1, i)] || 0;
          const stretch = (leftStretch + rightStretch) * 0.5;
          const slope =
            (actuation.linkStretch[Math.max(0, i - 1)] || 0) -
            (actuation.linkStretch[Math.min(actuation.linkStretch.length - 1, i)] || 0);
          const taper = 0.15 + Math.sin((1 - t) * Math.PI) * 0.76 + (1 - t) * 0.18;
          const pressureLead = clamp(pressure + slope * CONFIG.pressureLead, 0, 1.2);
          const widthBase =
            CONFIG.bodyWidth *
            taper *
            (1 + pressureLead * CONFIG.pressureBulge - Math.max(0, stretch) * CONFIG.stretchSlim);
          const hold = contact.hold[i];
          const flattened = 1 - hold * CONFIG.anchorFlatten;
          const width = widthBase * flattened;
          const turnBias = state.intent.turnCmd * CONFIG.turnWidthBias * taper;
          const outside = 1 + turnBias;
          const inside = 1 - turnBias;
          const shear = slope * 10 * (0.2 + pressureLead * 0.8) + state.intent.turnCmd * 4.2 * (1 - t * 0.55);
          const lagRate = snap
            ? 1000
            : lerp(
                CONFIG.headLagRate,
                t < 0.55 ? CONFIG.bodyLagRate : CONFIG.tailLagRate,
                t
              );
          const lag = expSmoothing(lagRate, CONFIG.fixedDt);

          render.pressure[i] = pressureLead;
          render.width[i] = width;

          const desiredLeftX = spine[i].x - frame.tx * shear + frame.nx * width * outside;
          const desiredLeftY = spine[i].y - frame.ty * shear + frame.ny * width * outside;
          const desiredRightX = spine[i].x + frame.tx * shear - frame.nx * width * inside;
          const desiredRightY = spine[i].y + frame.ty * shear - frame.ny * width * inside;

          left.x = lerp(left.x, desiredLeftX, lag);
          left.y = lerp(left.y, desiredLeftY, lag);
          right.x = lerp(right.x, desiredRightX, lag);
          right.y = lerp(right.y, desiredRightY, lag);
        }
      },

      draw(state) {
        ctx.clearRect(0, 0, width, height);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        for (let i = 0; i < state.body.spine.length - 1; i += 1) {
          const a = state.body.spine[i];
          const b = state.body.spine[i + 1];
          const l0 = state.render.left[i];
          const l1 = state.render.left[i + 1];
          const r0 = state.render.right[i];
          const r1 = state.render.right[i + 1];
          const pressure = (state.render.pressure[i] + state.render.pressure[i + 1]) * 0.5;
          const hold = (state.contact.hold[i] + state.contact.hold[i + 1]) * 0.5;
          const outerAlpha = 0.58 + pressure * 0.14 + hold * 0.18;
          const innerAlpha = 0.16 + pressure * 0.1;
          const spineAlpha = 0.42 + pressure * 0.1;

          ctx.strokeStyle = `rgba(255,255,255,${outerAlpha.toFixed(3)})`;
          ctx.lineWidth = CONFIG.lineWidth + pressure * 0.38;
          ctx.beginPath();
          ctx.moveTo(l0.x, l0.y);
          ctx.lineTo(l1.x, l1.y);
          ctx.moveTo(r0.x, r0.y);
          ctx.lineTo(r1.x, r1.y);
          ctx.stroke();

          ctx.strokeStyle = `rgba(255,255,255,${spineAlpha.toFixed(3)})`;
          ctx.lineWidth = CONFIG.lineWidth * 0.84;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();

          ctx.strokeStyle = `rgba(255,255,255,${innerAlpha.toFixed(3)})`;
          ctx.lineWidth = CONFIG.lineWidth * 0.72;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(l0.x, l0.y);
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(r0.x, r0.y);
          if (i % 2 === 0) {
            ctx.moveTo(l0.x, l0.y);
            ctx.lineTo(b.x, b.y);
          } else {
            ctx.moveTo(r0.x, r0.y);
            ctx.lineTo(b.x, b.y);
          }
          ctx.stroke();
        }

        for (let i = 0; i < state.body.spine.length; i += 2) {
          const pressure = state.render.pressure[i];
          const radius = CONFIG.dotRadius + pressure * 0.45;
          const alpha = 0.55 + pressure * 0.24;
          ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(state.body.spine[i].x, state.body.spine[i].y, radius, 0, Math.PI * 2);
          ctx.arc(state.render.left[i].x, state.render.left[i].y, radius * 0.85, 0, Math.PI * 2);
          ctx.arc(state.render.right[i].x, state.render.right[i].y, radius * 0.85, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    };

    const Simulation = {
      create() {
        return createState();
      },

      step(state, dt) {
        state.world.time += dt;
        BodyFrames.update(state);
        IntentSystem.update(state, dt);
        GaitSystem.advance(state, dt);
        GaitSystem.updateActuation(state);
        ContactSystem.update(state, dt);
        ForceSystem.apply(state, dt);
        IntegrationSystem.step(state, dt);
        RenderSystem.update(state);
      }
    };

    resize();
    const state = Simulation.create();
    pointer.x = width * 0.68;
    pointer.y = height * 0.5;

    let lastTime = performance.now();

    function animate(now) {
      const frameDt = Math.min((now - lastTime) / 1000, CONFIG.maxFrameDt);
      lastTime = now;
      state.world.accumulator += frameDt;

      let steps = 0;
      while (state.world.accumulator >= CONFIG.fixedDt && steps < CONFIG.maxSubsteps) {
        Simulation.step(state, CONFIG.fixedDt);
        state.world.accumulator -= CONFIG.fixedDt;
        steps += 1;
      }

      RenderSystem.draw(state);
      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", () => {
      const oldWidth = width || 1;
      const oldHeight = height || 1;
      const scaleX = window.innerWidth / oldWidth;
      const scaleY = window.innerHeight / oldHeight;
      resize();

      for (let i = 0; i < state.body.spine.length; i += 1) {
        const particle = state.body.spine[i];
        particle.x *= scaleX;
        particle.y *= scaleY;
        particle.px *= scaleX;
        particle.py *= scaleY;
        state.render.left[i].x *= scaleX;
        state.render.left[i].y *= scaleY;
        state.render.right[i].x *= scaleX;
        state.render.right[i].y *= scaleY;
        state.contact.anchorX[i] *= scaleX;
        state.contact.anchorY[i] *= scaleY;
      }

      state.intent.rawTarget.x *= scaleX;
      state.intent.rawTarget.y *= scaleY;
      state.intent.target.x *= scaleX;
      state.intent.target.y *= scaleY;
    });

    window.addEventListener("pointermove", (event) => {
      pointer.active = true;
      pointer.x = event.clientX;
      pointer.y = event.clientY;
    });

    window.addEventListener("pointerleave", () => {
      pointer.active = false;
    });

    requestAnimationFrame(animate);
  </script>
</body>
</html>
